openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PanelProof API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser authentication endpoints.
  - name: Drafts
    description: Comic episode preparation and review.
  - name: Reviews
    description: Shareable proofreader and editor review.
  - name: Storage
    description: Image upload and serving.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [Auth]
      summary: Get current login state
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Login state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [Auth]
      summary: Start browser login
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to login provider }
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [Auth]
      summary: Complete browser login
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect after login }
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [Auth]
      summary: End browser login
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect after logout }
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [Auth]
      summary: Exchange a mobile authorization code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Code rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [Auth]
      summary: End mobile login
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [Drafts]
      summary: Summarize the creator's episodes and review feedback
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /drafts:
    get:
      operationId: getDrafts
      tags: [Drafts]
      summary: List the signed-in creator's episodes
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Draft episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Draft"
    post:
      operationId: createDraft
      tags: [Drafts]
      summary: Save a newly split episode
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
      responses:
        "201":
          description: Episode saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          description: Invalid episode data or unclaimed image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /drafts/{draftId}:
    parameters:
      - name: draftId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/AuthorizationSessionHeader"
      - $ref: "#/components/parameters/SessionCookie"
    get:
      operationId: getDraft
      tags: [Drafts]
      summary: Get one episode and its comments
      responses:
        "200":
          description: Episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftDetail"
        "404":
          description: Episode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateDraft
      tags: [Drafts]
      summary: Update episode title or review status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftUpdate"
      responses:
        "200":
          description: Updated episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "404":
          description: Episode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteDraft
      tags: [Drafts]
      summary: Delete an episode and its review link
      responses:
        "204": { description: Episode deleted }
        "404":
          description: Episode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /drafts/{draftId}/share:
    post:
      operationId: createDraftShare
      tags: [Drafts]
      summary: Create or reuse an editor review link
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Share link enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "404":
          description: Episode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /drafts/{draftId}/comments/{commentId}:
    patch:
      operationId: updateComment
      tags: [Drafts]
      summary: Resolve or reopen reviewer feedback
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdate"
      responses:
        "200":
          description: Updated feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        "404":
          description: Feedback not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reviews/{shareToken}:
    get:
      operationId: getReview
      tags: [Reviews]
      summary: Open an episode through its share link
      parameters:
        - name: shareToken
          in: path
          required: true
          schema: { type: string, minLength: 20 }
      responses:
        "200":
          description: Shared episode and reviewer feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Review link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reviews/{shareToken}/pages/{pageIndex}:
    get:
      operationId: getReviewPageImage
      tags: [Reviews]
      summary: Stream a panel only when its share token is valid
      parameters:
        - name: shareToken
          in: path
          required: true
          schema: { type: string, minLength: 20 }
        - name: pageIndex
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Panel image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Link or panel not found }
  /reviews/{shareToken}/comments:
    post:
      operationId: createReviewComment
      tags: [Reviews]
      summary: Leave feedback as an editor or proofreader
      parameters:
        - name: shareToken
          in: path
          required: true
          schema: { type: string, minLength: 20 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewComment"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Review link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a private image upload URL
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/claim:
    post:
      operationId: claimUploadedObject
      tags: [Storage]
      summary: Set the private owner policy after upload
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimObjectInput"
      responses:
        "200":
          description: Object is owned by the signed-in creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimObjectResponse"
        "400":
          description: Invalid object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve a private panel to its creator
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Image content
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "401": { description: Sign in required }
        "403": { description: Not allowed }
        "404": { description: Image not found }
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema: { type: string }
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"], format: email }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1, format: uri }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    DraftPage:
      type: object
      required: [objectPath, width, height]
      properties:
        objectPath: { type: string, minLength: 1 }
        width: { type: integer, const: 800 }
        height: { type: integer, minimum: 1 }
    Draft:
      type: object
      required: [id, title, status, pages, shareEnabled, commentCount, resolvedCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [draft, in_review, approved] }
        pages:
          type: array
          items: { $ref: "#/components/schemas/DraftPage" }
        shareEnabled: { type: boolean }
        commentCount: { type: integer }
        resolvedCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DraftDetail:
      allOf:
        - $ref: "#/components/schemas/Draft"
        - type: object
          required: [shareUrl, comments]
          properties:
            shareUrl: { type: [string, "null"] }
            comments:
              type: array
              items: { $ref: "#/components/schemas/ReviewComment" }
    DraftInput:
      type: object
      required: [title, pages]
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        pages:
          type: array
          minItems: 1
          maxItems: 300
          items: { $ref: "#/components/schemas/DraftPage" }
    DraftUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        status: { type: string, enum: [draft, in_review, approved] }
    DashboardSummary:
      type: object
      required: [episodeCount, inReviewCount, openCommentCount, recentDrafts]
      properties:
        episodeCount: { type: integer }
        inReviewCount: { type: integer }
        openCommentCount: { type: integer }
        recentDrafts:
          type: array
          items: { $ref: "#/components/schemas/Draft" }
    ShareLink:
      type: object
      required: [shareUrl, shareEnabled]
      properties:
        shareUrl: { type: string, format: uri }
        shareEnabled: { type: boolean }
    Review:
      type: object
      required: [title, status, pages, comments]
      properties:
        title: { type: string }
        status: { type: string, enum: [draft, in_review, approved] }
        pages:
          type: array
          items: { $ref: "#/components/schemas/ReviewPage" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/ReviewComment" }
    ReviewPage:
      type: object
      required: [index, width, height, imageUrl]
      properties:
        index: { type: integer, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        imageUrl: { type: string }
    ReviewComment:
      type: object
      required: [id, reviewerName, pageIndex, body, resolved, createdAt]
      properties:
        id: { type: string, format: uuid }
        reviewerName: { type: string }
        pageIndex: { type: integer, minimum: 0 }
        body: { type: string }
        resolved: { type: boolean }
        createdAt: { type: string, format: date-time }
    CommentInput:
      type: object
      required: [reviewerName, pageIndex, body]
      properties:
        reviewerName: { type: string, minLength: 1, maxLength: 80 }
        pageIndex: { type: integer, minimum: 0 }
        body: { type: string, minLength: 1, maxLength: 2000 }
    CommentUpdate:
      type: object
      required: [resolved]
      properties:
        resolved: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }
    ClaimObjectInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 1 }
    ClaimObjectResponse:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }
